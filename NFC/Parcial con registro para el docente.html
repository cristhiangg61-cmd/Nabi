<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcial con registro</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5d6478;--ac:#2f5bea;--bad:#c62828;--ok:#2e7d32;--bd:#dfe3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#eceff6;--mu:#a0a8bd;--ac:#7b9bff;--bad:#ff6b6b;--ok:#5fd07a;--bd:#2c3242}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#eceff6;--mu:#a0a8bd;--ac:#7b9bff;--bad:#ff6b6b;--ok:#5fd07a;--bd:#2c3242}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 8px}h2{font-size:1.05rem;margin:0 0 12px}
p,li{color:var(--mu);line-height:1.5}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%}
.sm{background:transparent;color:var(--ac);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.big{font-size:2.4rem;text-align:center;margin:6px 0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu)}
.exam{-webkit-user-select:none;user-select:none}
</style></head>
<body><main id="app"><div class="card"><p>Cargando…</p></div></main>
<script>
// ====== EDITA AQUÍ: preguntas y tiempo ======
const MINUTOS = 10;
const PREGUNTAS = [
 {q:"¿Cuál es el resultado de 7 × 8?", o:["54","56","64","48"], c:1},
 {q:"¿Qué estructura de control repite un bloque mientras se cumpla una condición?", o:["if","switch","while","return"], c:2},
 {q:"¿Cuál es la capital de Colombia?", o:["Medellín","Cali","Bogotá","Neiva"], c:2},
 {q:"En binario, ¿cuánto vale 101?", o:["3","5","6","7"], c:1},
 {q:"¿Qué componente de Arduino recibe el código compilado?", o:["Microcontrolador","Resistencia","Protoboard","Buzzer"], c:0}
];
// ============================================
const app=document.getElementById("app");
let db=null,user=null,myId=null,ref=null,timer=null,unsub=null,verComoEst=false;
let S={estado:"inicio",motivo:"",resp:[],fin:0,nota:0};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora=ms=>ms?new Date(ms).toLocaleString("es-CO",{dateStyle:"short",timeStyle:"medium"}):"";

async function guardar(extra){
  if(!ref)return;
  try{await ref.set(Object.assign({estado:S.estado,motivo:S.motivo,nota:S.nota,total:PREGUNTAS.length,actualizado:Date.now()},extra||{}))}catch(e){}
}
async function anular(motivo){
  if(S.estado!=="corriendo")return;
  S.estado="anulado";S.motivo=motivo;clearInterval(timer);
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  render();await guardar({fin:Date.now()});
}
async function terminar(){
  if(S.estado!=="corriendo")return;
  S.nota=PREGUNTAS.reduce((n,p,i)=>n+(S.resp[i]===p.c?1:0),0);
  S.estado="terminado";clearInterval(timer);
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  render();await guardar({fin:Date.now()});
}
async function iniciar(){
  S={estado:"corriendo",motivo:"",resp:[],fin:Date.now()+MINUTOS*60000,nota:0};
  try{await document.documentElement.requestFullscreen()}catch(e){}
  render();timer=setInterval(tick,500);
  await guardar({inicio:Date.now()});
}
function tick(){
  const t=document.getElementById("t");if(!t)return;
  const r=Math.max(0,S.fin-Date.now());
  t.textContent=String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r/1000)%60).padStart(2,"0");
  if(r<=0)terminar();
}

function render(){
  if(S.estado==="inicio"){
    app.innerHTML=`<div class="card"><h1>Parcial virtual</h1><p>${PREGUNTAS.length} preguntas · ${MINUTOS} minutos.</p>
    <h2>Reglas</h2><ul><li>Se abre en pantalla completa.</li>
    <li><b class="bad">Si sales de la pantalla, cambias de pestaña o ventana, o recargas, el parcial se anula y el docente recibe el registro.</b></li>
    <li>Copiar, pegar y clic derecho están bloqueados.</li></ul>
    <button class="btn" id="go">Acepto e iniciar</button></div>`;
    document.getElementById("go").onclick=iniciar;
  }else if(S.estado==="corriendo"){
    app.innerHTML=`<div class="exam"><div class="bar"><span>Parcial</span><span id="t"></span></div>`+
    PREGUNTAS.map((p,i)=>`<div class="card"><h2>${i+1}. ${esc(p.q)}</h2>`+
      p.o.map((o,j)=>`<button class="opt ${S.resp[i]===j?"sel":""}" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join("")+`</div>`).join("")+
    `<button class="btn" id="fin">Entregar parcial</button></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.resp[+b.dataset.i]=+b.dataset.j;render()});
    document.getElementById("fin").onclick=terminar;tick();
  }else if(S.estado==="anulado"){
    app.innerHTML=`<div class="card"><div class="big bad">⛔</div><h1 class="bad" style="text-align:center">Parcial anulado</h1>
    <p style="text-align:center">Motivo: ${esc(S.motivo)}.</p><p style="text-align:center">Tu docente ya tiene el registro. Comunícate con él.</p></div>`;
  }else{
    app.innerHTML=`<div class="card"><div class="big ok">✅</div><h1 style="text-align:center">Parcial entregado</h1>
    <p style="text-align:center">Respuestas correctas: <b>${S.nota} de ${PREGUNTAS.length}</b></p></div>`;
  }
}

// ===== Panel del docente =====
function panel(){
  app.innerHTML=`<div class="card"><h1>Panel del docente</h1><p id="res">Cargando registro…</p>
  <button class="sm" id="est">Probar el parcial como estudiante</button></div>
  <div class="card wrap" id="tab"></div>`;
  document.getElementById("est").onclick=()=>{verComoEst=true;estudiante()};
  const badge={corriendo:"🟡 En curso",anulado:"⛔ Anulado",terminado:"✅ Entregado",inicio:"⚪ Habilitado"};
  unsub=db.collection("intentos").onSnapshot(async snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.actualizado||0)-(a.actualizado||0));
    let nombres={};try{nombres=await user.profiles(docs.map(d=>d.id))}catch(e){}
    const c=k=>docs.filter(d=>d.estado===k).length;
    document.getElementById("res").textContent=`${docs.length} estudiantes · ${c("corriendo")} en curso · ${c("terminado")} entregados · ${c("anulado")} anulados`;
    document.getElementById("tab").innerHTML=docs.length?`<table><tr><th>Estudiante</th><th>Estado</th><th>Motivo / nota</th><th>Hora</th><th></th></tr>`+
    docs.map(d=>`<tr><td>${esc((nombres[d.id]&&nombres[d.id].name)||"Estudiante")}</td><td>${badge[d.estado]||esc(d.estado)}</td>
    <td>${d.estado==="anulado"?esc(d.motivo):d.estado==="terminado"?d.nota+"/"+d.total:""}</td><td>${hora(d.actualizado)}</td>
    <td>${d.estado==="anulado"||d.estado==="corriendo"?`<button class="sm" data-id="${esc(d.id)}">Habilitar de nuevo</button>`:""}</td></tr>`).join("")+`</table>`:`<p>Aún no hay intentos registrados.</p>`;
    document.querySelectorAll("#tab button[data-id]").forEach(b=>b.onclick=async()=>{
      try{await db.doc("intentos/"+b.dataset.id).set({estado:"inicio",motivo:"",nota:0,total:PREGUNTAS.length,actualizado:Date.now()})}catch(e){}
    });
  },()=>{document.getElementById("res").textContent="No se pudo leer el registro."});
}

// ===== Estudiante =====
async function estudiante(){
  if(unsub){unsub();unsub=null}
  ref=db.doc("intentos/"+myId);
  try{
    const s=await ref.get();
    if(s.exists){
      const d=s.data();S.estado=d.estado;S.motivo=d.motivo||"";S.nota=d.nota||0;
      if(d.estado==="corriendo"){S.estado="corriendo";await anular("Recargaste o cerraste la página durante el parcial");return}
    }else S.estado="inicio";
  }catch(e){}
  render();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)anular("Cambiaste de pestaña o minimizaste la ventana")});
window.addEventListener("blur",()=>anular("La ventana perdió el foco (salió de la pantalla del parcial)"));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)anular("Salió de la pantalla completa")});
["copy","cut","paste","contextmenu","dragstart"].forEach(e=>document.addEventListener(e,ev=>{if(S.estado==="corriendo")ev.preventDefault()}));
document.addEventListener("keydown",ev=>{if(S.estado==="corriendo"&&(ev.key==="PrintScreen"||(ev.ctrlKey||ev.metaKey)&&["c","v","x","p","s","u"].includes(ev.key.toLowerCase())))ev.preventDefault()});

(async()=>{
  try{db=await claude.use("db");user=await claude.use("user")}catch(e){}
  if(!db||!user){app.innerHTML=`<div class="card"><h1>Inicia sesión</h1><p>Para presentar el parcial debes abrir este enlace con tu cuenta de Claude, con acceso que te dio tu docente. Así se puede registrar tu intento.</p></div>`;return}
  myId=await user.id();
  const docente=user.isOwner()||user.canEdit();
  if(docente)panel();else estudiante();
})();
</script></body></html>
