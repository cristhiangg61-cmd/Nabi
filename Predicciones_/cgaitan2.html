<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Torneo 2v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #07071a; color: #fff; overflow-x: hidden; }

    /* ── Scrollable bracket ── */
    .bracket-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
    .bracket-inner  { display: inline-flex; align-items: flex-start; gap: 0; min-width: max-content; padding: 0 8px; }

    /* ── Control buttons ── */
    .btn {
      background: #111130; border: 1px solid #2a2a55;
      border-radius: 7px; color: #8888bb; font-size: 11px;
      padding: 5px 14px; cursor: pointer; font-weight: 600;
      font-family: inherit; transition: background .15s, color .15s;
    }
    .btn:hover:not(:disabled) { background: #1a1a45; color: #aaaadd; }
    .btn:disabled { color: #2a2a44; cursor: default; }

    /* ── Modal overlay ── */
    .modal-bg {
      position: fixed; inset: 0; background: #000000bb;
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
    }
    .modal-box {
      background: #0f0f28; border: 1.5px solid #2d6fdd;
      border-radius: 14px; padding: 24px 20px;
      width: 100%; max-width: 400px; text-align: center;
    }
    .modal-btn {
      border-radius: 9px; padding: 12px 16px; cursor: pointer;
      color: #fff; font-size: 13px; font-weight: 600;
      min-width: 120px; flex: 1 1 120px; font-family: inherit;
      transition: filter .15s;
    }
    .modal-btn:hover { filter: brightness(1.25); }

    /* ── Team block ── */
    .team-block {
      border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column;
      flex-shrink: 0; transition: filter .15s;
      border-width: 1.5px; border-style: solid;
      position: relative;
    }
    .team-block.clickable { cursor: pointer; }
    .team-block.clickable:hover { filter: brightness(1.3); }
    .team-block .p1, .team-block .p2 {
      flex: 1; display: flex; align-items: center;
      padding: 0 8px; gap: 5px; overflow: hidden;
    }
    .team-block .p1 { border-bottom: 1px solid rgba(255,255,255,.06); }
    .team-block .num { font-size: 9px; font-weight: 700; opacity: .6; flex-shrink: 0; }
    .team-block .name {
      font-size: 11px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .team-block .name2 { color: #ffb0b0; }
    .team-block.done { opacity: .38; }
    .team-block.done::after {
      content: "ELIMINADO";
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; letter-spacing: 1px;
      color: #3a3a6a; pointer-events: none;
    }

    /* Color themes */
    .t-blue   { background: #0e1f3d; border-color: #2d6fdd; color: #7ab8ff; }
    .t-red    { background: #3d0e0e; border-color: #dd2d2d; color: #ff7a7a; }
    .t-win    { background: #0e2e1a; border-color: #27a050; color: #50e87a; }
    .t-empty  { background: #0d0d20; border-color: #282845; color: #3a3a60; border-style: dashed; opacity: .55; }
    .t-final  { background: #0e1f3d; border-color: #cc8800; color: #ffd700; }
    .t-champ  { background: #2a1a00; border-color: #cc8800; color: #ffd700; }
    .t-silver { background: #1c1c1c; border-color: #909090; color: #d0d0d0; }
    .t-bronze { background: #2a1400; border-color: #a05a20; color: #cd7f32; }
    .t-done   { background: #111128; border-color: #3a3a6a; color: #5a5a9a; }

    /* ── SVG connector lines ── */
    .conn-line { stroke: #2a2a5a; stroke-width: 1.5; fill: none; }

    /* ── Edit modal inputs ── */
    .edit-input {
      width: 100%; background: #080818; border: 1px solid #222244;
      color: #fff; border-radius: 5px; padding: 4px 8px;
      font-size: 11px; box-sizing: border-box; font-family: inherit;
    }
    .edit-input:focus { outline: 1px solid #2d6fdd; }
  </style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── CONSTANTES DE LAYOUT ──────────────────────────────────────────────────
// Todo el layout se calcula a partir de estos 3 valores
const BLK_W   = 148;  // ancho de un TeamBlock
const BLK_H   = 52;   // alto de un TeamBlock (dos jugadores)
const PAIR_GAP = 16;  // espacio entre los 2 bloques de un par en Cuartos

// Derivados — no tocar
const PAIR_H     = BLK_H * 2 + PAIR_GAP;        // alto total de un par de cuartos = 120
const PAIRS_GAP  = 24;                           // espacio entre par1 y par2 de cuartos
const SEMI_GAP   = PAIR_H + PAIRS_GAP;           // gap entre Semi1 y Semi2 = 144 — centrado exacto
const SEMI_OFFSET = Math.round((PAIR_H - BLK_H) / 2); // offset vertical para centrar semi en su par = 34

const CONN_W = 32; // ancho de los conectores SVG

const STORAGE_KEY = "torneo2v2_v2";

// ─── EQUIPOS POR DEFECTO ───────────────────────────────────────────────────
const EQ_DEFAULT = [
  ["Jugador 1","Jugador 2"],["Jugador 3","Jugador 4"],
  ["Jugador 5","Jugador 6"],["Jugador 7","Jugador 8"],
  ["Jugador 9","Jugador 10"],["Jugador 11","Jugador 12"],
  ["Jugador 13","Jugador 14"],["Jugador 15","Jugador 16"],
];

// ─── HELPERS ──────────────────────────────────────────────────────────────
const eqName  = eq => eq ? `${eq[0]} & ${eq[1]}` : "???";
const eqEq    = (a,b) => !!(a && b && a[0]===b[0] && a[1]===b[1]);
const deepClone = x => JSON.parse(JSON.stringify(x));

// ─── ESTADO ───────────────────────────────────────────────────────────────
function initState(eqs) {
  return {
    q: eqs.map(e=>[...e]),      // Cuartos: 8 equipos
    s: [null,null,null,null],   // Semifinal: 4 slots (0,1 = izq; 2,3 = der)
    f: [null,null],             // Final: 2 slots
    champ: null,
    sub: null,
    sl: [null,null],            // Perdedores de semi (para 3er puesto)
    third: null,
    fourth: null,
  };
}

function applyWin(st, stage, idx, winner, loser) {
  const ns = deepClone(st);
  if (stage === "q") {
    // idx 0..3 → ganador va a s[idx], perdedor eliminado
    ns.s[idx] = winner;
  } else if (stage === "s") {
    // idx 0 → izq (f[0]), idx 1 → der (f[1])
    ns.f[idx] = winner;
    ns.sl[idx] = loser;
  } else if (stage === "3p") {
    ns.third = winner;
    ns.fourth = loser;
  } else if (stage === "f") {
    ns.champ = winner;
    ns.sub = loser;
  }
  return ns;
}

function remapState(oldEqs, newEqs, st) {
  const remap = eq => {
    if (!eq) return null;
    const i = oldEqs.findIndex(e => eqEq(e, eq));
    return i >= 0 ? [...newEqs[i]] : [...eq];
  };
  return {
    q:      newEqs.map(e=>[...e]),
    s:      st.s.map(remap),
    f:      st.f.map(remap),
    champ:  remap(st.champ),
    sub:    remap(st.sub),
    sl:     st.sl.map(remap),
    third:  remap(st.third),
    fourth: remap(st.fourth),
  };
}

// ─── PERSISTENCIA ─────────────────────────────────────────────────────────
function save(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){} }
function load() { try { const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; } catch(e){return null;} }

// ─── TEAM BLOCK ───────────────────────────────────────────────────────────
function TeamBlock({ eq, theme="empty", width=BLK_W, height=BLK_H, clickable=false, done=false, onClick }) {
  const cls = ["team-block", `t-${theme}`, clickable&&eq?"clickable":"", done?"done":""].filter(Boolean).join(" ");
  return (
    <div className={cls} style={{ width, height }} onClick={clickable&&eq?onClick:undefined}>
      <div className="p1">
        <span className="num" style={{color:"inherit"}}>①</span>
        <span className="name">{eq?eq[0]:""}</span>
      </div>
      <div className="p2">
        <span className="num name2">②</span>
        <span className="name">{eq?eq[1]:""}</span>
      </div>
    </div>
  );
}

// ─── CONECTOR SVG CUARTOS→SEMI ────────────────────────────────────────────
// Dibuja las líneas que conectan 2 bloques de cuartos a 1 semi
// Altura total = PAIR_H (para el par) + PAIR_GAP (espacio interno) — no, PAIR_H ya incluye los 2 BLK_H + PAIR_GAP
// El semi está centrado en SEMI_OFFSET desde arriba del par
function ConnectorQS({ dir="right" }) {
  // El SVG tiene que cubrir el par completo verticalmente
  const h = PAIR_H;
  const w = CONN_W;
  const midY = PAIR_H / 2; // punto de salida hacia el semi (centro del par)
  const top  = BLK_H / 2;  // centro del bloque superior
  const bot  = BLK_H + PAIR_GAP + BLK_H / 2; // centro del bloque inferior

  if (dir === "right") {
    // líneas salen a la derecha
    return (
      <svg width={w} height={h} style={{display:"block",flexShrink:0}}>
        <line className="conn-line" x1={0} y1={top}  x2={w/2} y2={top}/>
        <line className="conn-line" x1={0} y1={bot}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={top} x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={midY} x2={w} y2={midY}/>
      </svg>
    );
  } else {
    // líneas salen a la izquierda
    return (
      <svg width={w} height={h} style={{display:"block",flexShrink:0}}>
        <line className="conn-line" x1={w}   y1={top}  x2={w/2} y2={top}/>
        <line className="conn-line" x1={w}   y1={bot}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={top}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={midY} x2={0}   y2={midY}/>
      </svg>
    );
  }
}

// ─── CONECTOR SVG SEMI→FINAL ──────────────────────────────────────────────
// Conecta 2 semis (separados por SEMI_GAP) a 1 slot de final (centrado entre ellos)
function ConnectorSF({ dir="right" }) {
  const h = BLK_H + SEMI_GAP + BLK_H; // alto total que cubren los 2 semis
  const w = CONN_W;
  const top  = BLK_H / 2;
  const bot  = BLK_H + SEMI_GAP + BLK_H / 2;
  const midY = h / 2;

  if (dir === "right") {
    return (
      <svg width={w} height={h} style={{display:"block",flexShrink:0}}>
        <line className="conn-line" x1={0} y1={top}  x2={w/2} y2={top}/>
        <line className="conn-line" x1={0} y1={bot}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={top} x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={midY} x2={w} y2={midY}/>
      </svg>
    );
  } else {
    return (
      <svg width={w} height={h} style={{display:"block",flexShrink:0}}>
        <line className="conn-line" x1={w}   y1={top}  x2={w/2} y2={top}/>
        <line className="conn-line" x1={w}   y1={bot}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={top}  x2={w/2} y2={bot}/>
        <line className="conn-line" x1={w/2} y1={midY} x2={0}   y2={midY}/>
      </svg>
    );
  }
}

// ─── COLUMNA CUARTOS ──────────────────────────────────────────────────────
function ColQuarters({ pairs, side, results, onMatch }) {
  // pairs: [[eq0,eq1],[eq2,eq3]]
  // results: [winner0, winner1]
  return (
    <div style={{display:"flex",flexDirection:"column",gap:PAIRS_GAP,alignItems:"center"}}>
      {pairs.map((pair,pi) => {
        const winner = results[pi];
        return (
          <div key={pi} style={{display:"flex",flexDirection:"column",gap:PAIR_GAP}}>
            {pair.map((eq,ei) => {
              const isWinner = eq && winner && eqEq(eq,winner);
              const isLoser  = eq && winner && !eqEq(eq,winner);
              const theme = !eq ? "empty" : isWinner ? "win" : isLoser ? "done" : side==="left" ? "blue" : "red";
              const canClick = pair[0] && pair[1] && !winner;
              return (
                <TeamBlock
                  key={ei} eq={eq} theme={theme}
                  clickable={canClick} done={isLoser}
                  onClick={()=>onMatch(pair[0],pair[1],"q",pi)}
                />
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ─── COLUMNA SEMIFINAL ────────────────────────────────────────────────────
function ColSemis({ semis, side, finalSlot, onMatch, semiIdx0 }) {
  // semis: [eq0, eq1] — los dos slots de semi de este lado
  // finalSlot: el ganador ya registrado (o null)
  // semiIdx0: 0 para izq, 1 para der (para llamar a onMatch con el idx correcto de final)
  return (
    <div style={{display:"flex",flexDirection:"column",gap:SEMI_GAP,alignItems:"center",marginTop:SEMI_OFFSET}}>
      {semis.map((eq,i) => {
        const isWinner = eq && finalSlot && eqEq(eq,finalSlot);
        const isLoser  = eq && finalSlot && !eqEq(eq,finalSlot);
        const theme = !eq ? "empty" : isWinner ? "win" : isLoser ? "done" : side==="left" ? "blue" : "red";
        const canClick = semis[0] && semis[1] && !finalSlot;
        return (
          <TeamBlock
            key={i} eq={eq} theme={theme}
            clickable={canClick} done={isLoser}
            onClick={()=>onMatch(semis[0],semis[1],"s",semiIdx0)}
          />
        );
      })}
    </div>
  );
}

// ─── COLUMNA FINAL ────────────────────────────────────────────────────────
function ColFinal({ f, champ, sl, thirdDone, onFinal }) {
  const canFinal = f[0] && f[1] && !champ && thirdDone;
  const mustThird = f[0] && f[1] && !champ && !thirdDone && sl[0] && sl[1];

  // El final tiene 2 slots centrados entre sí, con la misma lógica que semis
  // f[0] viene del lado izquierdo, f[1] del lado derecho
  // Alineamos verticalmente igual que los semis: marginTop = SEMI_OFFSET
  const totalH = BLK_H + SEMI_GAP + BLK_H;
  const midY = totalH / 2 - BLK_H / 2;

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{
        fontSize:10,fontWeight:700,color:"#cc8800",letterSpacing:2,
        textTransform:"uppercase",marginBottom:8,textAlign:"center"
      }}>Gran Final</div>

      {mustThird && (
        <div style={{
          color:"#cd7f32",fontSize:9,fontWeight:700,
          background:"#2a140022",border:"1px solid #a05a2044",
          borderRadius:6,padding:"3px 8px",marginBottom:6,textAlign:"center"
        }}>⚠ Juega 3er puesto primero</div>
      )}

      {/* Dos slots de final, centrados */}
      <div style={{display:"flex",flexDirection:"column",gap:SEMI_GAP,marginTop:SEMI_OFFSET}}>
        {[f[0],f[1]].map((eq,i) => {
          const isWinner = eq && champ && eqEq(eq,champ);
          const isLoser  = eq && champ && !eqEq(eq,champ);
          const theme = !eq ? "empty" : isWinner ? "win" : isLoser ? "done" : "final";
          return (
            <TeamBlock
              key={i} eq={eq} theme={theme}
              clickable={canFinal} done={isLoser}
              onClick={onFinal}
            />
          );
        })}
      </div>

      {canFinal && (
        <div onClick={onFinal} style={{
          color:"#ffd700",fontSize:9,fontWeight:700,cursor:"pointer",
          background:"#1a100044",border:"1px solid #cc880044",
          borderRadius:6,padding:"3px 10px",marginTop:6,
        }}>★ CLIC PARA JUGAR FINAL ★</div>
      )}

      {/* Campeón */}
      <div style={{marginTop:12,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <svg width="2" height="18" style={{display:"block"}}>
          <line x1="1" y1="0" x2="1" y2="18" stroke="#cc8800" strokeWidth="2"/>
        </svg>
        <div style={{color:"#ffd700",fontSize:9,fontWeight:700,letterSpacing:2,marginBottom:5,textTransform:"uppercase"}}>
          {champ ? "¡Campeones!" : "Campeón"}
        </div>
        <div style={{
          width:180,background:"#2a1a00",border:"2px solid #cc8800",
          borderRadius:10,overflow:"hidden",
          boxShadow: champ ? "0 0 20px #cc880055" : "none",
        }}>
          <div style={{display:"flex",alignItems:"center",padding:"0 8px",height:BLK_H/2,borderBottom:"1px solid #cc880033"}}>
            <span style={{color:"#ffd700",fontSize:9,fontWeight:700,marginRight:5,opacity:.8}}>①</span>
            <span style={{color:"#ffd700",fontSize:12,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{champ?champ[0]:""}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",padding:"0 8px",height:BLK_H/2}}>
            <span style={{color:"#ffb0b0",fontSize:9,fontWeight:700,marginRight:5,opacity:.8}}>②</span>
            <span style={{color:"#ffd700",fontSize:12,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{champ?champ[1]:""}</span>
          </div>
        </div>
        {champ && <div style={{color:"#cc8800",fontSize:12,marginTop:5}}>★ ★ ★</div>}
      </div>
    </div>
  );
}

// ─── MODAL GANADOR ────────────────────────────────────────────────────────
function MatchModal({ e1, e2, label, onChoose, onClose }) {
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        {label && <div style={{color:"#5a5a8a",fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:4,textTransform:"uppercase"}}>{label}</div>}
        <div style={{color:"#ffd700",fontSize:13,fontWeight:700,letterSpacing:2,marginBottom:18,textTransform:"uppercase"}}>¿Quién avanza?</div>
        <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
          <button className="modal-btn" style={{background:"#0e1f3d",border:"1.5px solid #2d6fdd"}} onClick={()=>onChoose(e1,e2)}>
            <div style={{color:"#7ab8ff",fontSize:10,fontWeight:700,marginBottom:4}}>① {e1[0]}</div>
            <div style={{color:"#fff",fontSize:10,marginBottom:10}}>② {e1[1]}</div>
            <div style={{color:"#50e87a",fontSize:11,fontWeight:700}}>✓ Avanza</div>
          </button>
          <div style={{color:"#333366",fontSize:13,fontWeight:700,alignSelf:"center"}}>VS</div>
          <button className="modal-btn" style={{background:"#3d0e0e",border:"1.5px solid #dd2d2d"}} onClick={()=>onChoose(e2,e1)}>
            <div style={{color:"#ff7a7a",fontSize:10,fontWeight:700,marginBottom:4}}>① {e2[0]}</div>
            <div style={{color:"#fff",fontSize:10,marginBottom:10}}>② {e2[1]}</div>
            <div style={{color:"#50e87a",fontSize:11,fontWeight:700}}>✓ Avanza</div>
          </button>
        </div>
        <button onClick={onClose} style={{marginTop:16,background:"transparent",border:"none",color:"#444477",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
      </div>
    </div>
  );
}

// ─── MODAL EDITAR NOMBRES ─────────────────────────────────────────────────
function EditModal({ equipos, onSave, onClose }) {
  const [buf, setBuf] = useState(equipos.map(e=>[...e]));
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" style={{maxHeight:"88vh",overflowY:"auto",textAlign:"left"}} onClick={e=>e.stopPropagation()}>
        <div style={{color:"#e0e4ff",fontSize:14,fontWeight:700,marginBottom:4}}>Editar equipos</div>
        <div style={{color:"#5a5a8a",fontSize:11,marginBottom:14}}>Los resultados se conservan.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {buf.map((eq,i) => (
            <div key={i} style={{background:"#0d0d20",borderRadius:8,padding:"8px 10px",border:"1px solid #1e1e3a"}}>
              <div style={{color:"#5a5a8a",fontSize:10,marginBottom:6}}>Equipo {i+1}</div>
              <input className="edit-input" value={eq[0]} placeholder="Jugador 1"
                onChange={e=>setBuf(b=>b.map((x,j)=>j===i?[e.target.value,x[1]]:x))} style={{marginBottom:4}}/>
              <input className="edit-input" value={eq[1]} placeholder="Jugador 2"
                onChange={e=>setBuf(b=>b.map((x,j)=>j===i?[x[0],e.target.value]:x))}/>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{background:"transparent",border:"1px solid #333355",borderRadius:7,color:"#6666aa",fontSize:12,padding:"6px 16px",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
          <button onClick={()=>onSave(buf.map(e=>[e[0].trim()||"???",e[1].trim()||"???"]))}
            style={{background:"#0e1f3d",border:"1.5px solid #2d6fdd",borderRadius:7,color:"#7ab8ff",fontSize:12,padding:"6px 16px",cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>
            Guardar
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── MEDAL ────────────────────────────────────────────────────────────────
function Medal({ pos }) {
  const cfg = {
    1:{bg:"#a07800",bd:"#ffd700",tx:"#ffd700",lbl:"ORO"},
    2:{bg:"#505050",bd:"#d0d0d0",tx:"#d0d0d0",lbl:"PLATA"},
    3:{bg:"#7a4500",bd:"#cd7f32",tx:"#cd7f32",lbl:"BRONCE"},
  }[pos];
  if (!cfg) return <div style={{width:40,textAlign:"center",color:"#5a5a7a",fontSize:12,fontWeight:700}}>4to</div>;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:40}}>
      <div style={{width:32,height:32,borderRadius:"50%",background:cfg.bg,border:`2px solid ${cfg.bd}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff"}}>{pos}</div>
      <div style={{fontSize:8,fontWeight:700,color:cfg.tx,marginTop:3}}>{cfg.lbl}</div>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────
function App() {
  const saved = load();
  const [equipos,  setEquipos]  = useState(()=>saved?.equipos  || EQ_DEFAULT);
  const [st,       setSt]       = useState(()=>saved?.st       || initState(EQ_DEFAULT));
  const [history,  setHistory]  = useState(()=>saved?.history  || []);
  const [modal,    setModal]    = useState(null);   // {e1,e2,label,stage,idx}
  const [editing,  setEditing]  = useState(false);
  const [msg,      setMsg]      = useState("Haz clic en un partido para registrar el ganador");

  useEffect(()=>{ save({equipos,st,history}); },[equipos,st,history]);

  // ── Quartos: pairs por lado
  // Lado izq: q[0..3] → pares [q[0],q[1]] y [q[2],q[3]]; resultados en s[0] y s[1]
  // Lado der: q[4..7] → pares [q[4],q[5]] y [q[6],q[7]]; resultados en s[2] y s[3]
  const leftPairs   = [[st.q[0],st.q[1]],[st.q[2],st.q[3]]];
  const rightPairs  = [[st.q[4],st.q[5]],[st.q[6],st.q[7]]];
  const leftQRes    = [st.s[0], st.s[1]];
  const rightQRes   = [st.s[2], st.s[3]];
  const leftSemis   = [st.s[0], st.s[1]];
  const rightSemis  = [st.s[2], st.s[3]];

  const thirdDone = !!st.third;
  const canThird  = st.sl[0] && st.sl[1] && !thirdDone;

  function handleMatch(e1, e2, stage, idx) {
    setModal({e1,e2,label:stage==="q"?"CUARTOS":stage==="s"?"SEMIFINAL":stage==="3p"?"3ER PUESTO":"GRAN FINAL",stage,idx});
  }
  function handleFinal() {
    if (!st.f[0]||!st.f[1]||st.champ) return;
    if (!thirdDone && st.sl[0] && st.sl[1]) return;
    setModal({e1:st.f[0],e2:st.f[1],label:"GRAN FINAL",stage:"f",idx:0});
  }
  function handleThird() {
    if (!canThird) return;
    setModal({e1:st.sl[0],e2:st.sl[1],label:"3ER PUESTO",stage:"3p",idx:0});
  }

  function handleChoose(winner,loser) {
    setHistory(h=>[...h,st]);
    const ns = applyWin(st, modal.stage, modal.idx, winner, loser);
    setSt(ns);
    setMsg(`${modal.label}: avanzó ${eqName(winner)}`);
    setModal(null);
  }

  function undo() {
    if (!history.length) return;
    setSt(history[history.length-1]);
    setHistory(h=>h.slice(0,-1));
    setMsg("Partido deshecho");
  }

  function reset() {
    if (!window.confirm("¿Reiniciar el torneo? Se perderán todos los resultados.")) return;
    setSt(initState(equipos));
    setHistory([]);
    setMsg("Torneo reiniciado");
  }

  function saveNames(newEqs) {
    const newSt = remapState(equipos, newEqs, st);
    const newHist = history.map(h=>remapState(equipos,newEqs,h));
    setEquipos(newEqs);
    setSt(newSt);
    setHistory(newHist);
    setEditing(false);
    setMsg("Nombres actualizados ✓");
  }

  // ── Label columnas ──
  const colLabel = (txt, color="#b0b4e0") => (
    <div style={{textAlign:"center",fontSize:10,fontWeight:700,color,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>{txt}</div>
  );

  // ── Alineación vertical del bracket ──
  // La columna de cuartos tiene altura: PAIR_H + PAIRS_GAP + PAIR_H = 264
  // La columna de semis tiene marginTop: SEMI_OFFSET, y altura: BLK_H + SEMI_GAP + BLK_H = 248
  // La columna de final tiene el mismo tratamiento que semis

  return (
    <div style={{background:"#07071a",minHeight:"100vh",padding:"16px 12px 32px",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>

      {/* Título */}
      <div style={{textAlign:"center",marginBottom:14}}>
        <div style={{color:"#e0e4ff",fontSize:17,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>
          TORNEO 2 VS 2 — ELIMINACIÓN DIRECTA
        </div>
        <div style={{color:"#3a3a6a",fontSize:11,marginTop:3}}>8 equipos · Cuartos → Semifinal → Final</div>
      </div>

      {/* Botones */}
      <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>setEditing(true)}>✎ Editar nombres</button>
        <button className="btn" onClick={undo} disabled={!history.length}>↩ Deshacer</button>
        <button className="btn" onClick={reset}>↺ Reiniciar</button>
      </div>
      <div style={{textAlign:"center",color:"#4a4a7a",fontSize:11,marginBottom:14,fontStyle:"italic"}}>{msg}</div>

      {/* Modales */}
      {modal && <MatchModal e1={modal.e1} e2={modal.e2} label={modal.label} onChoose={handleChoose} onClose={()=>setModal(null)}/>}
      {editing && <EditModal equipos={equipos} onSave={saveNames} onClose={()=>setEditing(false)}/>}

      {/* ── BRACKET ── */}
      <div style={{background:"#0d0d1e",border:"1px solid #181832",borderRadius:14,padding:"14px 10px",marginBottom:14}}>
        <div className="bracket-scroll">
          <div className="bracket-inner">

            {/* ── LADO IZQUIERDO ── */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginRight:0}}>
              <div style={{color:"#2d6fdd",fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Lado Azul</div>
              {colLabel("Cuartos")}
              <ColQuarters pairs={leftPairs} side="left" results={leftQRes}
                onMatch={handleMatch}/>
            </div>

            {/* Conector Q→S izq */}
            <div style={{display:"flex",flexDirection:"column",gap:PAIRS_GAP,marginTop:32}}>
              <ConnectorQS dir="right"/>
              <ConnectorQS dir="right"/>
            </div>

            {/* Semis izq */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginTop:32}}>
              {colLabel("Semifinal")}
              <ColSemis semis={leftSemis} side="left" finalSlot={st.f[0]}
                onMatch={handleMatch} semiIdx0={0}/>
            </div>

            {/* Conector S→F izq */}
            <div style={{marginTop:32+16}}>
              <ConnectorSF dir="right"/>
            </div>

            {/* CENTRO: Final + Campeón */}
            <div style={{marginTop:32}}>
              <ColFinal f={st.f} champ={st.champ} sl={st.sl} thirdDone={thirdDone} onFinal={handleFinal}/>
            </div>

            {/* Conector S→F der */}
            <div style={{marginTop:32+16}}>
              <ConnectorSF dir="left"/>
            </div>

            {/* Semis der */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginTop:32}}>
              {colLabel("Semifinal")}
              <ColSemis semis={rightSemis} side="right" finalSlot={st.f[1]}
                onMatch={handleMatch} semiIdx0={1}/>
            </div>

            {/* Conector Q→S der */}
            <div style={{display:"flex",flexDirection:"column",gap:PAIRS_GAP,marginTop:32}}>
              <ConnectorQS dir="left"/>
              <ConnectorQS dir="left"/>
            </div>

            {/* LADO DERECHO */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{color:"#dd2d2d",fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Lado Rojo</div>
              {colLabel("Cuartos")}
              <ColQuarters pairs={rightPairs} side="right" results={rightQRes}
                onMatch={handleMatch}/>
            </div>

          </div>
        </div>
      </div>

      {/* ── PANEL INFERIOR ── */}
      <div style={{display:"flex",gap:14,flexWrap:"wrap",justifyContent:"center"}}>

        {/* 3er Puesto */}
        <div style={{flex:"1 1 280px",background:"#0d0d1e",border:"1px solid #181832",borderRadius:12,padding:"14px 14px",minWidth:260}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <Medal pos={3}/>
            <div style={{color:"#cd7f32",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>3er Puesto</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",justifyContent:"center",marginBottom:10,flexWrap:"wrap"}}>
            <TeamBlock eq={st.sl[0]} theme={st.sl[0]?"blue":"empty"} clickable={canThird} onClick={handleThird}/>
            <span style={{color:"#33334a",fontSize:11,fontWeight:700}}>VS</span>
            <TeamBlock eq={st.sl[1]} theme={st.sl[1]?"red":"empty"} clickable={canThird} onClick={handleThird}/>
          </div>
          {canThird && (
            <div style={{textAlign:"center"}}>
              <button onClick={handleThird} style={{background:"#2a1400",border:"1px solid #a05a20",borderRadius:7,color:"#cd7f32",fontSize:11,fontWeight:700,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit"}}>
                🥉 Registrar 3er Puesto
              </button>
            </div>
          )}
          {st.third && (
            <>
              <div style={{textAlign:"center",color:"#333355",fontSize:9,margin:"8px 0 5px",textTransform:"uppercase",letterSpacing:1}}>Ganador</div>
              <div style={{display:"flex",justifyContent:"center"}}>
                <TeamBlock eq={st.third} theme="bronze"/>
              </div>
            </>
          )}
        </div>

        {/* Podio */}
        <div style={{flex:"1 1 280px",background:"#0d0d1e",border:"1px solid #181832",borderRadius:12,padding:"14px 14px",minWidth:260}}>
          <div style={{color:"#e0e4ff",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:2,textAlign:"center",marginBottom:12}}>Podio Final</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {[
              {pos:1,eq:st.champ,theme:"champ"},
              {pos:2,eq:st.sub,  theme:"silver"},
              {pos:3,eq:st.third,theme:"bronze"},
              {pos:4,eq:st.fourth,theme:"done"},
            ].map(({pos,eq,theme})=>(
              <div key={pos} style={{display:"flex",alignItems:"center",gap:10,background:"#0a0a18",borderRadius:8,padding:"6px 10px",border:"1px solid #141428"}}>
                <Medal pos={pos}/>
                <div style={{flex:1,minWidth:0}}>
                  <TeamBlock eq={eq} theme={eq?theme:"empty"} width="100%"/>
                </div>
              </div>
            ))}
          </div>
        </div>

      </div>

      <div style={{textAlign:"center",color:"#1e1e38",fontSize:10,marginTop:10}}>
        💾 Progreso guardado automáticamente
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
