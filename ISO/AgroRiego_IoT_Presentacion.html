<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroRiego IoT</title>
<style>
/* Dirección: presentación de proyecto agrícola. Verde bosque como acento de marca, azul agua como primera serie de datos.
   Layout: barra superior + índice lateral + una diapositiva por pantalla con scroll interno. */
:root{
  --bg:#f2f4ef;--surface:#fcfcfb;--ink:#101a14;--ink2:#4a544d;--mute:#898781;--line:#e1e0d9;--axis:#c3c2b7;
  --acc:#1f6f43;--acc2:#e1efe6;--onacc:#ffffff;--ok:#006300;--warn:#fab219;--ser:#ec835a;--crit:#d03b3b;--good:#0ca30c;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --ring:rgba(11,11,11,.10);--sh:0 1px 2px rgba(16,26,20,.05),0 6px 20px rgba(16,26,20,.05);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;--line:#2c2c2a;--axis:#383835;
  --acc:#52c486;--acc2:#16271d;--onacc:#07140c;--ok:#0ca30c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  --ring:rgba(255,255,255,.10);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;--line:#2c2c2a;--axis:#383835;
  --acc:#52c486;--acc2:#16271d;--onacc:#07140c;--ok:#0ca30c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  --ring:rgba(255,255,255,.10);--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
#top .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
#top .crumb{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:14px}
.ib:hover{background:var(--acc2)}
#prog{height:3px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#body{flex:1;min-height:0;display:flex;position:relative}
#side{width:310px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 24px;transition:margin .2s}
#side input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;margin-bottom:8px}
#side .sec>a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600;line-height:1.3;cursor:pointer}
#side .sec>a b{color:var(--acc);min-width:34px;font-variant-numeric:tabular-nums}
#side .sec>a:hover{background:var(--acc2)}
#side .sec>a.sl{display:block;padding:3px 8px 3px 50px;font-size:12.5px;font-weight:400;color:var(--ink2);border-radius:6px;line-height:1.35}
#side .on{background:var(--acc2)!important;color:var(--ink)!important;box-shadow:inset 3px 0 0 var(--acc)}
body.focus #side,body.focus #top{display:none}
body.noside #side{margin-left:-310px}
#main{flex:1;min-width:0;overflow:auto;scroll-behavior:smooth}
#stage{max-width:1160px;margin:0 auto;padding:26px 32px 40px}
#nav{flex:none;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 16px;background:var(--surface);border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
#nav .ib{font-weight:600}
.slide{animation:in .28s ease-out}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}#main{scroll-behavior:auto}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.eyebrow span{background:var(--acc);color:var(--onacc);border-radius:6px;padding:2px 8px;letter-spacing:.02em}
h2.t{font-size:clamp(26px,3.2vw,38px);line-height:1.12;letter-spacing:-.02em;margin:8px 0 6px;text-wrap:balance;font-weight:750}
.lede{font-size:17.5px;color:var(--ink2);max-width:78ch;margin:6px 0 18px;text-wrap:pretty}
h3{font-size:18px;margin:22px 0 8px;letter-spacing:-.01em}
h4{font-size:15px;margin:0 0 6px}
p{margin:0 0 10px;max-width:80ch;text-wrap:pretty}
.g{display:grid;gap:16px;margin:14px 0}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g.w6040{grid-template-columns:1.5fr 1fr}.g.w4060{grid-template-columns:1fr 1.5fr}
@media (max-width:900px){.g2,.g3,.g4,.g.w6040,.g.w4060{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  #side{position:absolute;z-index:5;top:0;bottom:0;left:0;box-shadow:var(--sh)}#stage{padding:18px 16px 32px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--sh);min-width:0}
.card.acc{border-left:4px solid var(--acc)}.card.s1{border-left:4px solid var(--s1)}.card.s2{border-left:4px solid var(--s2)}.card.cr{border-left:4px solid var(--crit)}.card.s3{border-left:4px solid var(--s3)}
.card p:last-child,.card ul:last-child{margin-bottom:0}
ul,ol{margin:0 0 10px;padding-left:22px}li{margin:3px 0;max-width:80ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
.tile .l{font-size:12.5px;color:var(--ink2);line-height:1.3}.tile .v{font-size:27px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.tile .s{font-size:12.5px;color:var(--ink2);margin-top:2px}.tile.pos .v{color:var(--ok)}.tile.neg .v{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:650;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.pill.ok::before{background:var(--good)}.pill.warn::before{background:var(--warn)}.pill.ser::before{background:var(--ser)}.pill.crit::before{background:var(--crit)}
.note{border-left:4px solid var(--acc);background:var(--acc2);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;max-width:90ch}
.note.w{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}.note.c{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.quote{font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.01em;border-left:5px solid var(--acc);padding:6px 0 6px 20px;margin:14px 0;max-width:62ch;text-wrap:pretty}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:650;color:var(--ink2);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--axis);background:var(--surface);position:sticky;top:0;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:color-mix(in srgb,var(--acc) 7%,var(--surface))}
tr.hl td{background:color-mix(in srgb,var(--s1) 9%,var(--surface))}
.tw.tall{max-height:520px;overflow:auto}
.cw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;box-shadow:var(--sh);min-width:0}
.cw h4{margin:0}.cw .sub{font-size:13px;color:var(--ink2);margin-bottom:6px}.cw .sc{overflow-x:auto}
.cw svg{display:block;width:100%;height:auto;min-width:360px}
svg text{fill:var(--ink2);font:12px system-ui,sans-serif}svg .ax text{fill:var(--mute);font-size:11.5px}svg .gl{stroke:var(--line);stroke-width:1}svg .bl{stroke:var(--axis);stroke-width:1}
svg .v{fill:var(--ink);font-weight:650;font-size:12px}svg .hit{outline:none}svg .hit:hover .bar,svg .hit:focus .bar{filter:brightness(1.1)}svg .hit:hover .xh,svg .hit:focus .xh{opacity:1}
svg .xh{stroke:var(--axis);stroke-width:1;opacity:0}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:6px 0 2px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ctl{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap;margin:4px 0 8px}
.ctl button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.ctl button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.ctl button:hover:not([aria-pressed="true"]){background:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.chip{background:var(--acc2);border-radius:999px;padding:3px 12px;font-size:13.5px}
.rng{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px}.rng input[type=range]{flex:1;min-width:180px;max-width:420px;accent-color:var(--acc)}.rng b{font-variant-numeric:tabular-nums;min-width:56px}
.seg{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin:8px 0}.seg i{display:block;height:100%}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.45;max-width:320px;opacity:0;transition:opacity .08s;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.tree{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;margin:14px 0}
.tree .lv{font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;text-transform:uppercase;letter-spacing:.03em}
.tree .row{display:flex;gap:10px;flex-wrap:wrap}.tree .bx{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.8px;box-shadow:var(--sh);cursor:default;transition:transform .12s,border-color .12s}
.tree .bx:hover{transform:translateY(-2px);border-color:var(--acc)}.tree .cen .bx{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600;font-size:15px}
.tree .arrow{grid-column:2;text-align:center;color:var(--mute);font-size:20px;line-height:1}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;padding:4px 0 8px;margin:10px 0}
.tl .st{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:13.5px}.tl .st b{display:block;color:var(--acc);margin-bottom:3px}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;font-size:14.5px}.kv dt{color:var(--ink2);font-weight:600}.kv dd{margin:0}
.big{font-size:clamp(34px,5.5vw,64px);line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:10px 0 10px;text-wrap:balance}
.cover{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;min-height:62vh}
@media (max-width:900px){.cover{grid-template-columns:1fr}}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.toc a{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.3;cursor:pointer}
.toc a:hover{border-color:var(--acc);background:var(--acc2)}.toc a b{color:var(--acc);font-size:20px;min-width:28px;line-height:1}.toc small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:3px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.chk input{margin-top:5px;accent-color:var(--acc);width:16px;height:16px}
.srch{width:100%;max-width:420px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.ref{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;max-width:110ch;padding-left:28px;text-indent:-28px}.ref a{color:var(--s1);word-break:break-all}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.45}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.swap>div{padding:11px 16px;border-bottom:1px solid var(--line)}.swap>div:nth-child(odd){border-right:1px solid var(--line);background:color-mix(in srgb,var(--crit) 6%,var(--surface))}.swap>div:nth-child(even){background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.swap>div.h{font-weight:750;font-size:13px;text-transform:uppercase;letter-spacing:.04em}.swap>div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:700px){.swap{grid-template-columns:1fr}.swap>div:nth-child(odd){border-right:0}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="bSide" aria-label="Mostrar u ocultar el índice">Índice</button>
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.5 4.2 6 7.4 6 10.8a6 6 0 0 1-12 0C6 9.900 8.500 6.700 12 2.500z" fill="var(--s1)"/><path d="M12 20c0-4 1.500-6.500 4.500-8" stroke="var(--surface)" stroke-width="1.800" fill="none" stroke-linecap="round"/></svg>AgroRiego IoT</div>
    <div class="crumb" id="crumb"></div>
    <button class="ib" id="bFocus" title="Modo presentación (tecla F)">Presentar</button>
    <button class="ib" id="bTheme" aria-label="Cambiar entre tema claro y oscuro">Tema</button>
  </header>
  <div id="prog"><i></i></div>
  <div id="body">
    <aside id="side" aria-label="Índice de la presentación"><input id="q" type="search" placeholder="Buscar diapositiva…" aria-label="Buscar diapositiva"><div id="toc"></div></aside>
    <main id="main"><div id="stage"></div></main>
  </div>
  <footer id="nav">
    <button class="ib" id="bPrev">← Anterior</button>
    <span id="count"></span>
    <button class="ib" id="bNext">Siguiente →</button>
  </footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
const nf=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const cop=n=>'COP '+nf(n);
const dec=(n,d=1)=>(n<0?'−':'')+Math.abs(n).toFixed(d).replace('.',',');
const mm=(n,d=1)=>dec(n/1e6,d)+' M';
const pc=(n,d=1)=>dec(n,d)+' %';
const axM=n=>Math.abs(n)>=1e6?dec(n/1e6,Math.abs(n)%1e6?1:0)+' M':Math.abs(n)>=1e3?nf(n):dec(n,n%1?1:0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ticks(mn,mx,c=5){if(mn===mx)mx=mn+1;const raw=(mx-mn)/c,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st,o=[];for(let v=a;v<=b+st/2;v+=st)o.push(+v.toFixed(6));return o}
/* ============ Componentes de contenido ============ */
const tbl=(head,rows,o={})=>{const n=o.n||[],tot=o.tot||[],hl=o.hl||[];return `<div class="tw ${o.cls||''}"><table><thead><tr>${head.map((h,i)=>`<th class="${n.includes(i)?'n':''}">${md(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr class="${tot.includes(ri)?'tot':hl.includes(ri)?'hl':''}">${r.map((c,i)=>`<td class="${n.includes(i)?'n':''}">${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
const tiles=a=>`<div class="tiles">${a.map(t=>`<div class="tile ${t.c||''}"><div class="l">${md(t.l)}</div><div class="v">${t.v}</div>${t.s?`<div class="s">${md(t.s)}</div>`:''}</div>`).join('')}</div>`;
const card=(t,b,c='')=>`<div class="card ${c}">${t?`<h4>${md(t)}</h4>`:''}${b}</div>`;
const note=(b,c='')=>`<div class="note ${c}">${md(b)}</div>`;
const g=(n,items,c='')=>`<div class="g g${n} ${c}">${items.join('')}</div>`;
const ul=a=>`<ul>${a.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
const ol=a=>`<ol>${a.map(x=>`<li>${md(x)}</li>`).join('')}</ol>`;
const P=s=>`<p>${md(s)}</p>`;
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const ctl=(id,opts,cur)=>`<div class="ctl" id="${id}" role="group">${opts.map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</div>`;
const lg=a=>`<div class="lg">${a.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const cw=(t,sub,inner,id)=>`<div class="cw"><h4>${md(t)}</h4><div class="sub">${md(sub||'')}</div><div class="sc" ${id?`id="${id}"`:''}>${inner}</div></div>`;
const seg=a=>`<div class="seg">${a.map(([v,c,t])=>`<i style="flex:${v};background:${c}" data-tip="${esc(t)}"></i>`).join('')}</div>`;
const SC=i=>`var(--s${i})`;
function bindCtl(id,root,fn){const el=$('#'+id,root);if(!el)return;el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.k)})}
/* ============ Gráficos SVG ============ */
function barPath(x,w,yb,yv,r=4,round=true){const up=yv<=yb,top=Math.min(yb,yv),bot=Math.max(yb,yv),h=bot-top;if(h<.5)return'';r=round?Math.min(r,h/2,w/2):0;
  return up?`M${x},${bot}V${top+r}${r?`Q${x},${top} ${x+r},${top}`:''}H${x+w-r}${r?`Q${x+w},${top} ${x+w},${top+r}`:''}V${bot}Z`:`M${x},${top}V${bot-r}${r?`Q${x},${bot} ${x+r},${bot}`:''}H${x+w-r}${r?`Q${x+w},${bot} ${x+w},${bot-r}`:''}V${top}Z`}
function colChart(o){const{cats,series,w=720,h=280,stack=false,fmt=nf,tick=axM,lab=false,lfmt=tick,colors,unit=''}=o;
  const m={l:o.ml||56,r:14,t:lab?24:14,b:o.mb||32},iw=w-m.l-m.r,ih=h-m.t-m.b;let mn=0,mx=0;

/* ============ Utilidad: tabla de criterios ponderados + barras de puntaje ============ */
function scoreBlock(cols,rows,id,pre='Puntaje total (1 a 10)'){
  const tot=cols.map((_,j)=>rows.reduce((a,r)=>a+r[1]/100*r[2+j],0));const mx=Math.max(...tot);
  const table=tbl(['Criterio','Peso',...cols],rows.map(r=>[r[0],r[1]+' %',...r.slice(2).map(x=>dec(x,0))]).concat([['**Puntaje total**','100 %',...tot.map(t=>`**${dec(t,2)}**`)]]),{n:cols.map((_,j)=>j+1+1),tot:[rows.length]});
  const chart=cw(pre,'Barra verde: opción seleccionada',hbar({items:cols.map((c,j)=>({l:c,v:tot[j],c:tot[j]===mx?'var(--acc)':'var(--s1)'})).sort((a,b)=>b.v-a.v),fmt:v=>dec(v,2),w:440,lw:150,max:10,rh:34,aria:pre}));
  return{table,chart,tot}}

<p class="lede">El presupuesto es el cálculo anticipado de los ingresos, costos, gastos e inversiones, construido con supuestos explícitos. Permite manejar los recursos con eficiencia, fijar prioridades y comprobar si se cumplen los objetivos (Baca Urbina, 2013; Sapag Chain y Sapag Chain, 2008).</p>

S('11.1','Horizonte del proyecto: 5 años (60 meses)',`
<p class="lede">No existe una regla que fije el número de periodos; lo define el equipo y debe justificarse (Baca Urbina, 2013). Se eligió 5 años por cuatro razones.</p>
<div class="g g2">${['Coincide con la proyección de demanda y de personal del estudio técnico (años 1 a 5).','Cubre la vida útil contable de los equipos de cómputo (5 años) y permite medir la recuperación de la inversión con el crecimiento de la demanda hasta el 6 % de los productores de fríjol.','Es un plazo habitual para negocios de tecnología de pequeña escala, en los que la incertidumbre sobre producto y precios crece rápidamente más allá de ese plazo.','El crédito se paga en 3 años, de modo que los años 4 y 5 muestran la operación sin deuda.'].map((t,i)=>`<div class="card acc" style="display:flex;gap:14px"><div style="font-size:26px;font-weight:800;color:var(--acc);line-height:1">${i+1}</div><div>${t}</div></div>`).join('')}</div>
<p>Los meses de desarrollo y validación (1 a 3) y de primeras ventas (4 a 6) forman parte del año 1 y <strong>no se evalúan por separado</strong>: la evaluación usa los cinco años completos. Al final del año 5 se supone la liquidación contable: se recupera el capital de trabajo y los equipos se valoran por su valor en libros; no se incluye un valor de continuidad del negocio.</p>
<div class="g w6040">${cw('El peso del valor de recuperación en el VPN','Millones de COP, valor presente a TMAR 24,25 %',hbar({items:[{l:'Flujos operativos',v:-20.0,lt:'≈ −20,0 M'},{l:'Valor de recuperación del año 5',v:55.1,lt:'55,1 M'},{l:'VPN del proyecto',v:35.1,lt:'35,1 M'}],pn:true,fmt:v=>dec(v,1)+' M',w:560,lw:190,rh:36,aria:'Peso del valor de recuperación'}))}
<div class="note c">Este supuesto pesa mucho: el valor de recuperación es de COP 163,1 millones y su valor presente (COP 55,1 millones) supera el VPN. Los flujos operativos por sí solos dan ≈ COP −20,0 millones. La evaluación no es conservadora en este punto; el numeral 12.1.6 mide qué pasa si solo se recupera una parte.</div></div>`);

S('11.2','11.2.1 Supuestos del presupuesto',`

S('12.1','12.1.1 Criterios y tasa de descuento',`

<div class="mono">VF = VP × (1 + i)ⁿ        VPN = −I₀ + Σ FNEₜ ÷ (1 + TMAR)ᵗ        TMAR = tasa libre de riesgo + prima de riesgo</div>

S('12.2','12.2 Metodología y 12.2.1 Beneficiarios y resultados esperados',`
<p class="lede">La evaluación económica y social excluye impuestos y financiamiento (transferencias) e incluye los beneficios que reciben los productores, en pesos constantes y descontados a una tasa social. Se asume, como simplificación declarada, una razón precio cuenta igual a 1. La tasa social es de <strong>9 % efectiva anual</strong>, el parámetro del DNP para proyectos de inversión pública (Resolución 1092 de 2022; antes 12 %), tomado aquí como referencia.</p>
${tiles([{l:'Predios con el sistema en 5 años',v:'840'},{l:'Hectáreas cubiertas',v:'2.772 ha',s:'3,3 ha por predio; 19,8 % de las 14.000 ha de fríjol'},{l:'Empleos directos',v:'2 a 3',s:'2 en años 1 y 2; 3 desde el año 3'},{l:'Impuestos generados en 5 años',v:'COP 131,9 M',s:'Renta e ICA: 131.900.448'}])}
${tbl(['Indicador','Valor'],[['Predios con el sistema en 5 años (escenario base)','840'],['Hectáreas cubiertas (3,3 ha por predio)','2.772 ha, equivalentes al 19,8 % de las 14.000 ha de fríjol del Huila'],['Empleos directos','2 en los años 1 y 2 y 3 desde el año 3 (numeral 10.3)'],['Empleo vinculado','Instaladores aliados en Garzón y Pitalito y servicios externos de contabilidad, asesoría agronómica y jurídica'],['Emisiones del transporte','De 5,4 a 16,3 t de CO₂ al año (numeral 9.3)'],['Impuestos generados en 5 años (renta e ICA)','COP 131.900.448']])}`);

S('12.2','12.2.2 Beneficio mínimo que justifica la inversión del productor',`
<p class="lede">Un predio típico de fríjol produce 4,52 t al año (19.000 t ÷ 4.200 productores), que a COP 8.267 por kilo (precio promedio del fríjol en el Huila en julio de 2026, Agronegocios) valen <strong>COP 37.398.333</strong>. Es un precio de mercado y no del productor: el cálculo es una referencia, no una medición.</p>
${tiles([{l:'Costo anual del kit y del plan para el productor',v:'COP 725.467',s:'Kit con instalación (1.750.000, vida útil de 5 años) más monitoreo (240.000 al año), a 12 % de oportunidad'},{l:'Umbral del productor',v:'1,9 %',s:'Del valor de su producción. Con 9 %: costo de 689.912 y umbral de 1,8 %'}])}

<div class="tiles" id="bpo"></div></div>

S('12.2','12.2.3 Indicadores sociales',`
<p class="lede">Beneficio por predio = porcentaje de pérdidas evitadas × valor de la producción. Los predios instalados en un año reciben medio año de beneficio ese año y no se cuentan beneficios después del año 5. Los costos sociales son la inversión, los costos variables y fijos, la comisión, el mercadeo y la variación del capital de trabajo, en pesos constantes y menos la recuperación del año 5; se excluyen renta, ICA e intereses. Todo se descuenta al 9 %.</p>
<div class="g w6040">
${tbl(['Beneficio supuesto (% de la producción)','Beneficio por predio al año (COP)','VPN social (COP)','TIR social','B/C social'],[['2 %','747.967','−136.529.801','−6,5 %','0,87'],['3 %','1.121.950','310.567.793','39,2 %','1,30'],['5 %','1.869.917','1.204.762.982','111,2 %','2,17']],{n:[1,2,3,4]})}
${cw('VPN social por escenario de beneficio','Millones de COP',colChart({cats:['2 %','3 %','5 %'],series:[{n:'VPN social',v:[-136.529801,310.567793,1204.762982]}],lab:true,lfmt:v=>nf(v),tick:v=>nf(v),fmt:v=>nf(v)+' M',w:480,h:280,aria:'VPN social'}))}
</div>
<div class="note"><strong>Lectura.</strong> Hay dos umbrales. Para el <strong>productor</strong>, el kit se paga solo si evita pérdidas o costos por más de <strong>1,9 %</strong> del valor de su producción. Para la <strong>sociedad</strong>, el VPN social solo es positivo si el beneficio supera el <strong>2,3 %</strong>, porque debe cubrir además los costos fijos y el capital de trabajo. Con 2 % el proyecto no se justifica socialmente; con 3 % ya lo hace con claridad. Las TIR sociales altas son consecuencia de que el beneficio es una hipótesis y de que el costo social se concentra en pocos años: muestran sensibilidad, no un resultado esperado.</div>`);

<div class="g g2">${card('Beneficios sociales no financieros',ul(['Mayor ingreso familiar.','Menor pérdida de cosechas.','Uso más eficiente del agua.','Mayor resiliencia ante la variabilidad climática.','Empleo local calificado.']),'s3')}${card('Vínculo con el marco lógico',P('Estos beneficios están alineados con el fin del marco lógico (numeral 4.3). Su magnitud depende del ahorro real del sistema, que se mide con los indicadores de volumen de agua y de pérdidas evitadas definidos en los numerales 9.5 y 4.3.'),'acc')}</div>`);

/* ============ 13. Conclusiones ============ */
const CON=[['Problema y solución','Los pequeños productores del Huila pierden cosechas por riego manual y por infraestructura insuficiente. AgroRiego IoT (sensores de humedad, control local de electroválvulas, alimentación solar y app móvil) ataca la causa raíz y es técnicamente viable con componentes disponibles en el mercado nacional.'],
['Estudio técnico','La base de operación es Neiva (7,94/10), en un taller-bodega arrendado con salida a la Ruta 45 (7,45/10). Una célula de ensamble tiene capacidad de 912 kits al año y el cuello de botella es la instalación en campo (≈ 225 kits por técnico). Con la visita preventiva incluida, el segundo técnico desde el año 3 es necesario.'],
['Estudio ambiental','El impacto es bajo y manejable; no requiere licencia ambiental. La obligación principal es la responsabilidad extendida del productor sobre los residuos electrónicos y las baterías, con una partida anual de COP 1.200.000.'],
['Estudio administrativo','Se constituye una SAS con tres socios, un gerente en nómina (COP 2.800.000 más 2 % de comisión) y técnicos por horas al salario mínimo de 2026, cuyo costo por hora productiva es de COP 18.910, no los COP 12.000 supuestos en el estudio técnico.'],
['Presupuesto','Con un horizonte de 5 años, la inversión inicial es de COP 39.591.691 (fija 5.650.000, diferida 6.946.000 y capital de trabajo 26.995.691). La necesidad máxima de financiamiento de los socios es de **COP 86.291.055**, mucho mayor que los COP 19,6 millones de inversión técnica referencial. Los ingresos pasan de COP 147,0 millones (año 1) a COP 621,8 millones (año 5) y el EBITDA es positivo desde el año 2.'],
['El precio del estudio técnico no es viable','Con kit a COP 1.000.000 e instalación a COP 190.000, el VPN es de COP −200,9 millones y el EBITDA es negativo los cinco años. El precio mínimo del kit con ese diseño sería de COP 1.560.838.'],
['Diseño comercial adoptado','Con kit a COP 1.500.000, instalación a COP 250.000 y plan de monitoreo de COP 20.000 al mes (50 % de adopción), el VPN a la TMAR de 24,25 % es de **COP 35,1 millones**, la TIR de **36,0 %**, la relación beneficio/costo de 1,04 y la recuperación de la inversión en 4,1 años. El proyecto es **viable de forma condicionada**.'],
['Fragilidad del resultado','Sin plan de monitoreo el VPN es prácticamente cero; el proyecto deja de ser viable si la demanda cae por debajo del 84 % del escenario base, si el precio del kit baja de COP 1.372.308 con el monitoreo vendido, o si los costos variables suben más de 12 %. La simulación da una probabilidad de VPN positivo de 53 %. El VPN positivo proviene de recuperar el capital de trabajo en el año 5 (sin esa recuperación es de ≈ COP −20 millones) y, con repuestos de garantía del 5 %, vehículo a COP 800 por km y recuperación del 75 %, baja a COP 3,8 millones.'],
['Evaluación social','El sistema se justifica para el productor si evita pérdidas o costos por más del 1,9 % del valor de su producción, y para la sociedad si el beneficio supera el 2,3 % (tasa social de 9 %, Resolución 1092 de 2022 del DNP). En el escenario base se cubren 2.772 hectáreas (19,8 % del fríjol del Huila) y se generan 2 a 3 empleos directos.']];

S('13','Conclusiones 6 a 9: viabilidad financiera y social',`<div style="display:grid;gap:14px">${[5,6,7,8].map(conCard).join('')}</div>
${tiles([{l:'VPN',v:'COP 35,1 M',c:'pos'},{l:'TIR',v:'36,0 %'},{l:'B/C',v:'1,04'},{l:'Recuperación',v:'4,1 años'},{l:'Probabilidad de VPN positivo',v:'53 %'}])}`);
S('13','Limitaciones del estudio',`<div class="g g2">${['**Demanda.** La demanda (2 % a 6 % de los productores de fríjol) es una hipótesis; no hay encuesta ni preventas propias.','**Precio.** La disposición a pagar por el kit y por el plan de monitoreo no está validada y no se encontraron precios publicados de las alternativas (numeral 8.4.6).','**Beneficio.** El ahorro o las pérdidas evitadas del productor no están medidos; la evaluación social usa escenarios hipotéticos.','**Costos estimados.** El vehículo por kilómetro, los repuestos de garantía, el arriendo, la plataforma y los trámites son estimaciones del equipo pendientes de cotización.','**Trabajo de los socios.** Dos de los tres socios aportan trabajo sin remuneración (numeral 10.4).','**Datos de contexto.** Inflación, tasas y salario mínimo son los de octubre y noviembre de 2026 y deben actualizarse al decidir.'].map((t,i)=>`<div class="card s2" style="display:flex;gap:14px"><div style="font-size:24px;font-weight:800;color:var(--s2);line-height:1;min-width:24px">${i+1}</div><div>${md(t)}</div></div>`).join('')}</div>`);
S('13','Recomendaciones',`<div class="g g2">${['**No ejecutar el proyecto con el precio del estudio técnico.** Cualquier decisión de inversión debe partir del diseño comercial del numeral 8.4.5 o de uno con márgenes equivalentes.','**Confirmar el precio con preventas** antes de comprometer el capital: compromisos de compra de al menos 20 a 30 productores o asociaciones a COP 1.750.000 con instalación, y medir la disposición a pagar por el plan de monitoreo.','**Medir el beneficio con las unidades de validación:** volumen de agua aplicado y pérdidas evitadas en tres predios aliados, para comprobar que supera el 2,3 % del valor de la producción (umbral social; el del productor es 1,9 %).','**Asegurar la financiación completa:** COP 86.291.055 de necesidad máxima, con aportes de los socios, convocatorias de emprendimiento, incubadoras universitarias y líneas de crédito agropecuario con tasa de fomento.','**Proteger el margen:** cotizar a los proveedores, agrupar las instalaciones en rutas y limitar los costos fijos en el año 1 (por ejemplo, desarrollo en espacio universitario mientras no haya volumen).','**Dar prioridad al plan de monitoreo** como fuente de ingresos recurrentes con costo variable bajo, y revisar su adopción cada trimestre.','**Medir el costo real de visitas y garantía** en las unidades de validación (kilómetros, horas, kits por viaje y repuestos usados), porque son los supuestos de costo con mayor efecto y menor respaldo.','**Actualizar el presupuesto cada año** con el salario mínimo, la inflación, las tasas de interés y las tarifas vigentes, y volver a calcular el VPN con los datos reales.'].map((t,i)=>`<div class="card acc" style="display:flex;gap:14px"><div style="font-size:24px;font-weight:800;color:var(--acc);line-height:1;min-width:24px">${i+1}</div><div>${md(t)}</div></div>`).join('')}</div>`);

function show(i,fromHash){i=clamp(i,0,DECK.length-1);if(i===cur&&!fromHash)return;cur=i;const d=DECK[i];
  const lab=TL[d.key]||'';
  stage.innerHTML=`<article class="slide">${d.key==='0'?'':`<div class="eyebrow"><span>${d.key}</span>${esc(lab)}</div>`}${d.key==='0'?'':`<h2 class="t">${esc(d.title)}</h2>`}${d.body}</article>`;
  if(d.init)d.init(stage);main.scrollTop=0;
  $('#crumb').textContent=(d.key==='0'?'':d.key+' · ')+lab;$('#count').textContent=`Diapositiva ${i+1} de ${DECK.length}`;
  $('#prog i').style.width=((i+1)/DECK.length*100)+'%';$('#bPrev').disabled=i===0;$('#bNext').disabled=i===DECK.length-1;
  if(!fromHash){try{history.replaceState(null,'','#slide-'+(i+1))}catch(e){}}mark();showTip(null)}
function go(k){const i=DECK.findIndex(d=>d.key===k);if(i>=0)show(i)}
$('#bPrev').onclick=()=>show(cur-1);$('#bNext').onclick=()=>show(cur+1);
$('#bSide').onclick=()=>{document.body.classList.toggle('noside')};
$('#bFocus').onclick=()=>document.body.classList.toggle('focus');
$('#bTheme').onclick=()=>{const r=document.documentElement,dark=(r.dataset.theme==='dark')||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};
$('#q').addEventListener('input',e=>buildToc(e.target.value));
$('#toc').addEventListener('click',e=>{const a=e.target.closest('[data-i]');if(a){show(+a.dataset.i);if(innerWidth<=900)document.body.classList.add('noside')}});
stage.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a)go(a.dataset.go)});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){e.preventDefault();show(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(DECK.length-1);
  else if(e.key==='f'||e.key==='F')document.body.classList.toggle('focus');
  else if(e.key==='Escape')document.body.classList.remove('focus')});
addEventListener('hashchange',()=>{const m=/^#slide-(\d+)$/.exec(location.hash);if(m)show(+m[1]-1,true)});
if(innerWidth<=900)document.body.classList.add('noside');
buildToc();const m0=/^#slide-(\d+)$/.exec(location.hash);show(m0?+m0[1]-1:0,true);
</script>
</body>
